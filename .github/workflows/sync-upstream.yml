name: Sync T3 upstream

on:
  schedule:
    - cron: "23 20 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-t3-upstream
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'twodotgarv/t3code' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      active: ${{ steps.sync.outputs.active }}
      base: ${{ steps.sync.outputs.base }}
      upstream: ${{ steps.sync.outputs.upstream }}
      head: ${{ steps.sync.outputs.head }}
      pr: ${{ steps.sync.outputs.pr }}
    steps:
      # Public fetch avoids checkout's credential cleanup, which traverses malformed vendored gitlinks.
      - name: Check out public source without credentials
        env:
          CHECKOUT_SHA: ${{ github.sha }}
        run: |
          git init .
          git remote add origin https://github.com/twodotgarv/t3code.git
          git sparse-checkout set --no-cone --stdin <<'PATTERNS'
          /*
          !/.repos/
          !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          PATTERNS
          git -c credential.helper= fetch --filter=blob:none --no-recurse-submodules --no-tags origin "$CHECKOUT_SHA"
          git checkout --detach "$CHECKOUT_SHA"
      - name: Prepare one draft update PR
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/sync-upstream.cjs prepare

  validate:
    needs: prepare
    if: needs.prepare.outputs.active == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Candidate code and install hooks receive no write token or repository secrets.
    permissions:
      contents: read
    steps:
      # Public fetch avoids checkout's credential cleanup, which traverses malformed vendored gitlinks.
      - name: Check out public source without credentials
        env:
          CHECKOUT_SHA: ${{ needs.prepare.outputs.head }}
        run: |
          git init .
          git remote add origin https://github.com/twodotgarv/t3code.git
          git sparse-checkout set --no-cone --stdin <<'PATTERNS'
          /*
          !/.repos/
          !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          PATTERNS
          git -c credential.helper= fetch --filter=blob:none --no-recurse-submodules --no-tags origin "$CHECKOUT_SHA"
          git checkout --detach "$CHECKOUT_SHA"
      - name: Test sync merge behavior
        run: node --test .github/scripts/sync-upstream.test.cjs
      - name: Setup Vite+ and dependencies
        uses: ./.github/actions/setup-ci-deps
      - name: Install Chromium for affected browser tests
        run: node apps/web/node_modules/playwright/cli.js install --with-deps --only-shell chromium
      - name: Check the candidate against fork main
        env:
          SYNC_BASE: ${{ needs.prepare.outputs.base }}
        run: vp run check:changed "$SYNC_BASE" --concurrency 1

  finish:
    needs: [prepare, validate]
    if: always() && needs.prepare.result == 'success' && needs.prepare.outputs.active == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Use the trusted workflow revision, not scripts imported by the candidate.
      # Public fetch avoids checkout's credential cleanup, which traverses malformed vendored gitlinks.
      - name: Check out public source without credentials
        env:
          CHECKOUT_SHA: ${{ github.sha }}
        run: |
          git init .
          git remote add origin https://github.com/twodotgarv/t3code.git
          git sparse-checkout set --no-cone --stdin <<'PATTERNS'
          /*
          !/.repos/
          !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          PATTERNS
          git -c credential.helper= fetch --filter=blob:none --no-recurse-submodules --no-tags origin "$CHECKOUT_SHA"
          git checkout --detach "$CHECKOUT_SHA"
      - name: Record current validation and request owner review
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_BASE: ${{ needs.prepare.outputs.base }}
          SYNC_UPSTREAM: ${{ needs.prepare.outputs.upstream }}
          SYNC_HEAD: ${{ needs.prepare.outputs.head }}
          SYNC_PR: ${{ needs.prepare.outputs.pr }}
          VALIDATION_RESULT: ${{ needs.validate.result }}
        run: node .github/scripts/sync-upstream.cjs finish
